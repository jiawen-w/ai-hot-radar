name: AI热点雷达自动更新

# 云端定时更新：抓取 AI 热点 → 规则筛选 → 追加更新页面 → 推送到 GitHub Pages。
# 运行在 GitHub 云服务器上，电脑断网不影响；历史累积制与原页面规则完全保留。
on:
  schedule:
    # GitHub Actions 的 cron 为 UTC。北京时间 7:00–21:00 每 5 分钟
    # = UTC 前日 23:00 至当日 13:00 每 5 分钟，故写为下方表达式。
    - cron: '*/5 23,0-13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ai-hot-radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取并更新热点
        id: radar
        run: |
          python3 scripts/radar_update.py > /tmp/radar_result.json 2> /tmp/radar_log.txt || true
          cat /tmp/radar_log.txt
          echo "--- result ---"
          cat /tmp/radar_result.json

      - name: 提交并推送
        run: |
          CHANGED=$(python3 -c "import json;print(json.load(open('/tmp/radar_result.json'))['changed'])" 2>/dev/null || echo false)
          if [ "$CHANGED" = "True" ]; then
            git config user.name "ai-hot-radar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git pull --rebase origin main || true
            git add -A
            git commit -m "auto update: AI热点雷达 $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "无提交内容"
            git push
          else
            echo "无新增热点，跳过提交"
          fi
